[tool.black]
line-length = 79
target-version = ['py39']
extend-exclude = '''
(
  ^/manage.py
  | ^/vedette/settings.py
  | ^/events/migrations/.*$
  | ^/projects/migrations/.*$
  | ^/web/migrations/.*$
  | ^/api/migrations/.*$
)
'''

[tool.poetry]
name = "vedette"
version = "0.3.0"
description = "Error tracking application"
authors = ["Matigakis Panagiotis <pmatigakis@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
celery = "5.4.0"
Django = "5.1.6"
djangorestframework = "3.15.2"
psycopg2 = "2.9.6"
python-dotenv = "1.0.1"
redis = "5.2.1"
requests = "2.32.3"
gunicorn = "23.0.0"
whitenoise = "6.9.0"
tqdm = "4.67.1"
psycopg = {version = "3.2.4", extras = ["binary"]}

[tool.poetry.group.dev.dependencies]
pre-commit = "4.1.0"
coverage = "7.6.10"
factory-boy = "3.3.3"
freezegun = "1.5.1"
isort = "6.0.0"
black = "25.1.0"
flake8 = "7.1.1"
bandit = "1.8.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
